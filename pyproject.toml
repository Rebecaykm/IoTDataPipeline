[project]
name = "iotdatapipeline"
version = "0.1.0"
description = ""
authors = [
    {name = "Your Name",email = "you@example.com"}
]
readme = "README.md"
requires-python = ">=3.13,<4.0"
dependencies = [
    "sqlalchemy (>=2.0.0,<3.0.0)",
    "pyodbc (>=5.2.0,<6.0.0)",
    "pymcprotocol (==0.3.0)",
    "tabulate (>=0.9.0,<0.10.0)",
    "pyarrow (>=21.0.0,<22.0.0)",
    "celery (>=5.5.3,<6.0.0)",
    "redis (>=7.0.1,<8.0.0)",
    "textual (>=6.5.0,<7.0.0)",
    "rich (>=14.2.0,<15.0.0)",
    "python-dotenv (>=1.2.1,<2.0.0)",
    "prometheus-client (>=0.26.0,<0.27.0)"
]

[tool.poetry]
# Esto es un SERVICIO que se ejecuta por script (poetry run python Prensas.py),
# no una librería que alguien instale. Sin esto, Poetry busca instalar el
# paquete src/iotdatapipeline —que nunca existió, es resto de `poetry new`— y
# `poetry install` falla en una máquina limpia con:
#     src\iotdatapipeline does not contain any element
package-mode = false


[tool.poetry.group.dev.dependencies]
pytest = "^9.1.1"
openpyxl = "^3.1.5"
pywin32 = "^312"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
