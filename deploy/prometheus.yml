# Prometheus: raspa /metrics del servicio cada 15 s.
# Lo arranca deploy/iniciar-observabilidad.ps1
#
# PLANTILLA. Los __PUERTO_*__ los resuelve ese script, que escribe la versión
# final en deploy\.generado\ (no versionada).

global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - alertas.yml

scrape_configs:
  - job_name: iotdatapipeline
    static_configs:
      - targets: ['localhost:__PUERTO_RECOLECTOR__']
        labels:
          planta: 'principal'

  - job_name: prometheus
    static_configs:
      - targets: ['localhost:__PUERTO_PROMETHEUS__']
