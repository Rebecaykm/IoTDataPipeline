# PLANTILLA. __APP__ y __OBS__ los resuelve iniciar-observabilidad.ps1,
# que escribe la versión final en deploy\.generado\ (no versionada).
apiVersion: 1

providers:
  - name: IoT Planta
    orgId: 1
    folder: 'IoT Planta'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      # Ruta ABSOLUTA: Grafana no expande rutas relativas aquí.
      # Apunta a .generado y no al repositorio porque los tableros también
      # llevan resuelto el puerto del recolector.
      path: __GEN__\dashboards
      foldersFromFilesStructure: false
